name: Refresh Instagram token

# Instagram tokens last ~60 days. This renews it on the 1st and 15th of each month.
on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and update secret
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          new=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$new" ]; then echo "Refresh failed: $(echo "$resp" | head -c 300)"; exit 1; fi
          echo "::add-mask::$new"
          gh secret set IG_TOKEN --repo "${{ github.repository }}" --body "$new"
          echo "Token refreshed."
