name: Post to Instagram

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30
    - cron: "30 2 * * *"    # 08:00 IST  morning
    - cron: "30 7 * * *"    # 13:00 IST  afternoon
    - cron: "30 12 * * *"   # 18:00 IST  evening
    - cron: "30 15 * * *"   # 21:00 IST  night
  workflow_dispatch:
    inputs:
      slot:
        description: "Which post to publish now"
        default: "auto"
        type: choice
        options: [auto, morning, afternoon, evening, night]

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: pip install -r requirements.txt
      - name: Publish post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: python post.py ${{ github.event.inputs.slot || 'auto' }}
      - name: Save poster preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: previews/
          if-no-files-found: ignore
          retention-days: 3
